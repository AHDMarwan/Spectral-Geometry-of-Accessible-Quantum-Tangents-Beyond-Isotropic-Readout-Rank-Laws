[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accessible-quantum-tangents"
version = "0.1.0"
description = "Reproducible experiments for spectral accessibility of quantum tangents"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<4",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
aqt = "aqt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
