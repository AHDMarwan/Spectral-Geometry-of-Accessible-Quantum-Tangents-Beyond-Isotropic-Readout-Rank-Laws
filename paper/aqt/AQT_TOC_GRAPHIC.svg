<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="110mm" height="20mm" viewBox="0 0 1100 200">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="black"/>
    </marker>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:700;fill:#000}
      .label{font-family:Arial,Helvetica,sans-serif;font-size:27px;fill:#000}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#000}
      .line{stroke:#000;stroke-width:4;fill:none}
      .thin{stroke:#000;stroke-width:3;fill:none}
      .dash{stroke:#000;stroke-width:4;fill:none;stroke-dasharray:13 9}
    </style>
  </defs>

  <!-- fixed measurement -->
  <text x="20" y="38" class="title">Fixed measurement</text>
  <rect x="35" y="100" width="26" height="70" class="thin"/>
  <rect x="78" y="72" width="26" height="98" class="thin"/>
  <rect x="121" y="38" width="26" height="132" class="thin"/>
  <rect x="164" y="85" width="26" height="85" class="thin"/>
  <text x="20" y="195" class="small">measurement-score space</text>

  <line x1="220" y1="103" x2="282" y2="103" class="thin" marker-end="url(#arrow)"/>

  <!-- tangent covariance -->
  <ellipse cx="500" cy="105" rx="195" ry="72" class="line"/>
  <text x="410" y="30" class="title">Tangent covariance C</text>
  <line x1="345" y1="105" x2="655" y2="105" class="thin" marker-end="url(#arrow)"/>
  <line x1="500" y1="60" x2="500" y2="150" class="thin" marker-end="url(#arrow)"/>

  <!-- same-rank readouts with different orientation -->
  <g transform="rotate(-21 485 105)">
    <rect x="465" y="49" width="40" height="112" class="line"/>
  </g>
  <rect x="360" y="88" width="290" height="34" class="dash"/>
  <text x="312" y="177" class="small">physical readout</text>
  <line x1="395" y1="161" x2="451" y2="126" class="thin" marker-end="url(#arrow)"/>
  <text x="558" y="177" class="small">aligned readout</text>
  <line x1="610" y1="158" x2="585" y2="124" class="thin" marker-end="url(#arrow)"/>
  <text x="375" y="198" class="small">same rank r  •  different spectral orientation</text>

  <line x1="710" y1="103" x2="772" y2="103" class="thin" marker-end="url(#arrow)"/>

  <!-- operational consequence -->
  <text x="805" y="38" class="title">Accessible tangent mass</text>
  <text x="805" y="88" class="label">misaligned → smaller</text>
  <text x="805" y="128" class="label">aligned → larger</text>
  <text x="805" y="177" class="small">finite-shot directional signal changes</text>
</svg>
