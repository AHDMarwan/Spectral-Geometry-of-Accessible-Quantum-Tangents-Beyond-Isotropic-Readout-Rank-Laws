name: Paper production figures and citation pass

on:
  push:
    branches:
      - main
      - paper-rewrite-rank-orientation
    paths:
      - "paper/manuscript/**"
      - ".github/workflows/paper-production.yml"
  pull_request:
    branches:
      - main
    paths:
      - "paper/manuscript/**"
      - ".github/workflows/paper-production.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-paper-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib pennylane
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-publishers texlive-science zip
      - name: Restore complete rewrite and apply author metadata
        run: python paper/manuscript/author_metadata_finalize.py
      - name: Make production pass rerun-safe
        run: python paper/manuscript/production_idempotency_hotfix.py
      - name: Apply production manuscript pass
        run: python paper/manuscript/production_finalize.py
      - name: Apply code and results repository citation
        run: python paper/manuscript/repository_citation_finalize.py
      - name: Cite submitted isotropic rank-law manuscript
        run: python paper/manuscript/prior_paper_temporary_citation.py
      - name: Compact bibliography links and remove numeric ORCID prose
        run: python paper/manuscript/bibliography_visual_finalize.py
      - name: Apply final manuscript polish
        run: python paper/manuscript/final_submission_polish.py
      - name: Enforce final visual and ORCID policy
        run: python paper/manuscript/final_visual_policy.py
      - name: Add comprehensive appendices
        run: python paper/manuscript/appendices_finalize.py
      - name: Move all legacy figure legends below plots
        run: python paper/manuscript/figure_scripts/legacy_visual_cleanup.py
      - name: Move publication figure legends below plots
        run: python paper/manuscript/figure_scripts/publication_visual_cleanup.py
      - name: Verify legend generator policy
        run: |
          if grep -q 'ax.legend' paper/manuscript/make_paper_figures.py; then
            echo 'In-panel legend remains in legacy generator'
            exit 1
          fi
          grep -q 'def legend_below' paper/manuscript/make_paper_figures.py
          grep -q 'fig.legend(' paper/manuscript/make_paper_figures.py
          grep -q 'legend_below(fig)' paper/manuscript/make_paper_figures.py
          grep -q 'bbox_to_anchor=(0.5, 0.018)' paper/manuscript/make_paper_figures.py
      - name: Generate legacy vector figures used by the rewrite
        run: |
          cd paper/manuscript
          python make_paper_figures.py
      - name: Generate publication data figures
        run: python paper/manuscript/figure_scripts/make_publication_figures.py
      - name: Generate appendix diagnostic figures
        run: python paper/manuscript/figure_scripts/make_appendix_figures.py
      - name: Generate PennyLane circuit figures
        run: python paper/manuscript/figure_scripts/draw_circuits_pennylane.py
      - name: Insert circuit figure and PennyLane citation
        run: python paper/manuscript/insert_circuit_figure.py
      - name: Compile rewritten manuscript
        run: |
          cd paper/manuscript
          pdflatex -interaction=nonstopmode -halt-on-error spectral_geometry_rewrite.tex
          pdflatex -interaction=nonstopmode -halt-on-error spectral_geometry_rewrite.tex
          pdflatex -interaction=nonstopmode -halt-on-error spectral_geometry_rewrite.tex
          test -s spectral_geometry_rewrite.pdf
          if grep -q 'undefined citations' spectral_geometry_rewrite.log; then
            echo 'Undefined citation detected'
            exit 1
          fi
          if grep -q 'undefined references' spectral_geometry_rewrite.log; then
            echo 'Undefined cross-reference detected'
            exit 1
          fi
      - name: Promote rewrite to canonical manuscript
        run: |
          cd paper/manuscript
          cp spectral_geometry_rewrite.tex spectral_geometry.tex
          cp spectral_geometry_rewrite.pdf spectral_geometry.pdf
          rm -f spectral_geometry_submission_package.zip
          zip -qr spectral_geometry_submission_package.zip \
            spectral_geometry.pdf spectral_geometry.tex \
            CITATION_EQUATION_AUDIT.md FIGURE_VISUAL_QA_CHECKLIST.md data figure_scripts figures
      - name: Sanity-check production files
        run: |
          test -s paper/manuscript/spectral_geometry.pdf
          test -s paper/manuscript/figures/production/fig_u1_alignment_scaling.pdf
          test -s paper/manuscript/figures/production/fig_symmetry_breaking_control.pdf
          test -s paper/manuscript/figures/production/fig_fixed_weight_rank_fraction.pdf
          test -s paper/manuscript/figures/appendix_operational_gains.pdf
          test -s paper/manuscript/figures/appendix_noise_robustness.pdf
          test -s paper/manuscript/figures/appendix_u1_fit_diagnostics.pdf
          test -s paper/manuscript/figures/generated_circuits/circuit_ry_rz_cz.pdf
          test -s paper/manuscript/figures/generated_circuits/circuit_su2_cnot.pdf
          test -s paper/manuscript/figures/generated_circuits/circuit_su2_cz_ring.pdf
          test -s paper/manuscript/figures/generated_circuits/circuit_su2_cz_random_matching.pdf
          test -s paper/manuscript/figures/generated_circuits/circuit_su2_haar_u4.pdf
          test -s paper/manuscript/figures/generated_circuits/circuit_u1_rz_xy.pdf
          grep -q 'Rank Baselines and Spectral Orientation' paper/manuscript/spectral_geometry.tex
          grep -q '\\label{fig:circuits}' paper/manuscript/spectral_geometry.tex
          grep -q '\\appendix' paper/manuscript/spectral_geometry.tex
          grep -q '\\label{app:score_geometry}' paper/manuscript/spectral_geometry.tex
          grep -q '\\label{app:grassmann}' paper/manuscript/spectral_geometry.tex
          grep -q '\\label{app:walsh_rank}' paper/manuscript/spectral_geometry.tex
          grep -q '\\label{app:crossfit}' paper/manuscript/spectral_geometry.tex
          grep -q '\\label{app:operational}' paper/manuscript/spectral_geometry.tex
          grep -q 'Appendix~\\ref{app:grassmann}' paper/manuscript/spectral_geometry.tex
          grep -q 'Appendix~\\ref{app:walsh_rank}' paper/manuscript/spectral_geometry.tex
          grep -q '\\bibitem{Fernandez2025}' paper/manuscript/spectral_geometry.tex
          grep -q '\\bibitem{AitHaddou2026MeasurementAccessible}' paper/manuscript/spectral_geometry.tex
          grep -q '\\bibitem{AitHaddou2026IsotropicRankLaws}' paper/manuscript/spectral_geometry.tex
          grep -q '\\cite{AitHaddou2026IsotropicRankLaws}' paper/manuscript/spectral_geometry.tex
          grep -q 'arXiv identifier pending' paper/manuscript/spectral_geometry.tex
          grep -q 'A_1(18)=0.283586' paper/manuscript/spectral_geometry.tex
          grep -q '\\usepackage{orcidlink}' paper/manuscript/spectral_geometry.tex
          grep -q '\\orcidlink{0009-0008-1734-1721}' paper/manuscript/spectral_geometry.tex
          grep -q '\\email{aithaddou.marwan@outlook.com}' paper/manuscript/spectral_geometry.tex
          grep -q 'Mohamed Bennai\\,\\orcidlink{0000-0002-7364-5171}' paper/manuscript/spectral_geometry.tex
          grep -q 'GitHub reproducibility repository' paper/manuscript/spectral_geometry.tex
          grep -q '\\begin{center}' paper/manuscript/spectral_geometry.tex
          if grep -q '\\boxed{\\text{rank fixes a baseline' paper/manuscript/spectral_geometry.tex; then
            echo 'Core prose message must not be boxed'
            exit 1
          fi
          if grep -q 'ORCID: 0009-0008-1734-1721' paper/manuscript/spectral_geometry.tex; then
            echo 'Author numeric ORCID prose should not be visible'
            exit 1
          fi
          if grep -q 'ORCID: 0000-0002-7364-5171' paper/manuscript/spectral_geometry.tex; then
            echo 'Acknowledgment numeric ORCID prose should not be visible'
            exit 1
          fi
      - name: Commit canonical rewritten PDF and assets
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/manuscript/spectral_geometry.tex \
                  paper/manuscript/spectral_geometry.pdf \
                  paper/manuscript/spectral_geometry_submission_package.zip \
                  paper/manuscript/spectral_geometry_rewrite.tex \
                  paper/manuscript/figures/production \
                  paper/manuscript/figures/generated_circuits \
                  paper/manuscript/figures/appendix_*.pdf \
                  paper/manuscript/figures/appendix_*.png
          if git diff --cached --quiet; then
            echo "No production changes to commit."
          else
            git commit -m "Promote production rewrite with appendices [skip ci]"
            git reset --hard HEAD
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
