name: Paper production figures and citation pass

on:
  push:
    branches:
      - main
      - paper-rewrite-rank-orientation
    paths:
      - "paper/prx/**"
      - ".github/workflows/paper-production.yml"
  pull_request:
    branches:
      - main
    paths:
      - "paper/prx/**"
      - ".github/workflows/paper-production.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-paper-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib pennylane
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-publishers texlive-science zip
      - name: Apply production manuscript pass
        run: python paper/prx/production_finalize.py
      - name: Apply code and results repository citation
        run: python paper/prx/repository_citation_finalize.py
      - name: Generate legacy vector figures used by the rewrite
        run: |
          cd paper/prx
          python make_prx_figures.py
      - name: Generate publication data figures
        run: python paper/prx/figure_scripts/make_publication_figures.py
      - name: Generate PennyLane circuit figures
        run: python paper/prx/figure_scripts/draw_circuits_pennylane.py
      - name: Insert circuit figure and PennyLane citation
        run: python paper/prx/insert_circuit_figure.py
      - name: Compile rewritten manuscript
        run: |
          cd paper/prx
          pdflatex -interaction=nonstopmode -halt-on-error spectral_geometry_prx_rewrite.tex
          pdflatex -interaction=nonstopmode -halt-on-error spectral_geometry_prx_rewrite.tex
          pdflatex -interaction=nonstopmode -halt-on-error spectral_geometry_prx_rewrite.tex
          test -s spectral_geometry_prx_rewrite.pdf
          if grep -q 'undefined citations' spectral_geometry_prx_rewrite.log; then
            echo 'Undefined citation detected'
            exit 1
          fi
      - name: Promote rewrite to canonical manuscript
        run: |
          cd paper/prx
          cp spectral_geometry_prx_rewrite.tex spectral_geometry_prx.tex
          cp spectral_geometry_prx_rewrite.pdf spectral_geometry_prx.pdf
          rm -f spectral_geometry_prx_submission_package.zip
          zip -qr spectral_geometry_prx_submission_package.zip \
            spectral_geometry_prx.pdf spectral_geometry_prx.tex \
            CITATION_EQUATION_AUDIT.md FIGURE_VISUAL_QA_CHECKLIST.md data figure_scripts figures
      - name: Sanity-check production files
        run: |
          test -s paper/prx/spectral_geometry_prx.pdf
          test -s paper/prx/figures/production/fig_u1_alignment_scaling.pdf
          test -s paper/prx/figures/production/fig_symmetry_breaking_control.pdf
          test -s paper/prx/figures/production/fig_fixed_weight_rank_fraction.pdf
          test -s paper/prx/figures/generated_circuits/circuit_ry_rz_cz.pdf
          test -s paper/prx/figures/generated_circuits/circuit_su2_cnot.pdf
          test -s paper/prx/figures/generated_circuits/circuit_su2_cz_ring.pdf
          test -s paper/prx/figures/generated_circuits/circuit_su2_cz_random_matching.pdf
          test -s paper/prx/figures/generated_circuits/circuit_su2_haar_u4.pdf
          test -s paper/prx/figures/generated_circuits/circuit_u1_rz_xy.pdf
          grep -q 'Rank Baselines and Spectral Orientation' paper/prx/spectral_geometry_prx.tex
          grep -q '\\label{fig:circuits}' paper/prx/spectral_geometry_prx.tex
          grep -q '\\bibitem{Fernandez2025}' paper/prx/spectral_geometry_prx.tex
          grep -q '\\bibitem{AitHaddou2026MeasurementAccessible}' paper/prx/spectral_geometry_prx.tex
          grep -q 'A_1(18)=0.283586' paper/prx/spectral_geometry_prx.tex
      - name: Commit canonical rewritten PDF and assets
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/prx/spectral_geometry_prx.tex \
                  paper/prx/spectral_geometry_prx.pdf \
                  paper/prx/spectral_geometry_prx_submission_package.zip \
                  paper/prx/spectral_geometry_prx_rewrite.tex \
                  paper/prx/figures/production \
                  paper/prx/figures/generated_circuits
          if git diff --cached --quiet; then
            echo "No production changes to commit."
          else
            git commit -m "Promote production rewrite to canonical manuscript [skip ci]"
            # Figure generation may leave deterministic tracked legacy figures
            # modified but intentionally outside the production commit. Clean those
            # worktree-only changes before rebasing onto any concurrent main update.
            git reset --hard HEAD
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
