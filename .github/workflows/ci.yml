name: Numerical CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest
      - name: Smoke experiment
        run: aqt run --profile profiles/smoke.json --output results/smoke
      - name: Isotropic control smoke
        run: aqt controls --output results/controls --samples 5000
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-numerical-output
          path: results/
          if-no-files-found: error
          retention-days: 14
