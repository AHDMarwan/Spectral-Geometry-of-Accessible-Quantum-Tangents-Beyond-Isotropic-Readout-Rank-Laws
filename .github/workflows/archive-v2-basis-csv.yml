name: Archive rigorous-v2 basis CSV results

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  archive:
    if: ${{ startsWith(github.head_ref, 'archive-v2-basis-csv') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Download immutable basis artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf artifact-analysis shard-artifacts
          mkdir -p artifact-analysis shard-artifacts
          gh run download 31315984014 \
            --repo AHDMarwan/Spectral-Geometry-of-Accessible-Quantum-Tangents-Beyond-Isotropic-Readout-Rank-Laws \
            --name rigorous-v2_basis-analysis \
            --dir artifact-analysis
          gh run download 31315984014 \
            --repo AHDMarwan/Spectral-Geometry-of-Accessible-Quantum-Tangents-Beyond-Isotropic-Readout-Rank-Laws \
            --pattern 'rigorous-v2_basis-shard-*' \
            --dir shard-artifacts
      - name: Stage aggregate and shard CSV files
        shell: bash
        run: |
          set -euo pipefail
          dest='results/rigorous-v2_basis/run-31315984014'
          rm -rf "$dest"
          mkdir -p "$dest/analysis" "$dest/shards"

          find artifact-analysis/analysis -maxdepth 1 -type f -name '*.csv' -exec cp {} "$dest/analysis/" \;
          test "$(find "$dest/analysis" -maxdepth 1 -type f -name '*.csv' | wc -l)" -eq 15
          test -f "$dest/analysis/paired_measurement_basis_contrasts.csv"

          for d in shard-artifacts/rigorous-v2_basis-shard-*; do
            name="$(basename "$d")"
            mkdir -p "$dest/shards/$name"
            cp "$d/raw.csv" "$dest/shards/$name/raw.csv"
          done

          test "$(find "$dest/shards" -type f -name 'raw.csv' | wc -l)" -eq 32
          echo 'Aggregate CSVs:'
          find "$dest/analysis" -maxdepth 1 -type f -name '*.csv' -printf '%f\n' | sort
          echo 'Shard CSV count:'
          find "$dest/shards" -type f -name 'raw.csv' | wc -l
      - name: Commit basis CSV archive to PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f results/rigorous-v2_basis/run-31315984014
          git commit -m 'Archive rigorous-v2 basis CSV results from run 31315984014'
          git push origin HEAD:${{ github.head_ref }}
