name: Archive rigorous-v2 orientation CSV results

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  archive:
    if: ${{ startsWith(github.head_ref, 'archive-v2-orientation-csv') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Download immutable orientation artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf artifact-analysis shard-artifacts
          mkdir -p artifact-analysis shard-artifacts
          gh run download 31315904994 \
            --repo AHDMarwan/Spectral-Geometry-of-Accessible-Quantum-Tangents-Beyond-Isotropic-Readout-Rank-Laws \
            --name rigorous-v2_orientation-analysis \
            --dir artifact-analysis
          gh run download 31315904994 \
            --repo AHDMarwan/Spectral-Geometry-of-Accessible-Quantum-Tangents-Beyond-Isotropic-Readout-Rank-Laws \
            --pattern 'rigorous-v2_orientation-shard-*' \
            --dir shard-artifacts
      - name: Stage aggregate and shard CSV files
        shell: bash
        run: |
          set -euo pipefail
          dest='results/rigorous-v2_orientation/run-31315904994'
          rm -rf "$dest"
          mkdir -p "$dest/analysis" "$dest/shards"

          find artifact-analysis/analysis -maxdepth 1 -type f -name '*.csv' -exec cp {} "$dest/analysis/" \;
          test "$(find "$dest/analysis" -maxdepth 1 -type f -name '*.csv' | wc -l)" -eq 16
          test -f "$dest/analysis/merged_random_readout_null.csv"

          for d in shard-artifacts/rigorous-v2_orientation-shard-*; do
            name="$(basename "$d")"
            mkdir -p "$dest/shards/$name"
            find "$d" -maxdepth 1 -type f -name '*.csv' -exec cp {} "$dest/shards/$name/" \;
          done

          test "$(find "$dest/shards" -type f -name 'raw.csv' | wc -l)" -eq 32
          test "$(find "$dest/shards" -type f -name 'random_readout_null.csv' | wc -l)" -gt 0
          echo 'Aggregate CSVs:'
          find "$dest/analysis" -maxdepth 1 -type f -name '*.csv' -printf '%f\n' | sort
          echo 'Shard CSV counts:'
          echo "raw=$(find "$dest/shards" -type f -name 'raw.csv' | wc -l) null=$(find "$dest/shards" -type f -name 'random_readout_null.csv' | wc -l)"
      - name: Commit orientation CSV archive to PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f results/rigorous-v2_orientation/run-31315904994
          git commit -m 'Archive rigorous-v2 orientation CSV results from run 31315904994'
          git push origin HEAD:${{ github.head_ref }}
