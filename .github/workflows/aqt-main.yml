name: Build AQT main

on:
  push:
    branches: [main]
    paths:
      - 'paper/aqt/**'
      - 'paper/manuscript/figures/**'
      - '.github/workflows/aqt-main.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-science unzip
      - name: Build AQT manuscript
        run: |
          cd paper/aqt
          unzip -o template_support.zip
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          if grep -qi 'undefined citations' main.log; then
            echo 'Undefined citation detected'
            exit 1
          fi
          if grep -qi 'undefined references' main.log; then
            echo 'Undefined cross-reference detected'
            exit 1
          fi
      - name: Upload AQT PDF
        uses: actions/upload-artifact@v4
        with:
          name: aqt-main-pdf
          path: paper/aqt/main.pdf
          if-no-files-found: error
