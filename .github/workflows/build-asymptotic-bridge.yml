name: Build exploratory asymptotic bridge

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.head_ref == 'asymptotic-rank-theory-bridge' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements/reproducible.txt
      - run: pip install --no-deps -e .
      - name: Test asymptotic identities and existing inference
        run: pytest -q tests/test_asymptotic_bridge.py tests/test_rigorous_inference.py
      - name: Build post-hoc bridge from archived raw tables
        run: |
          rm -rf results/exploratory_asymptotic_bridge
          python -m aqt.asymptotic_bridge \
            --raw results/rigorous-v2_primary/run-31313459321/analysis/merged_raw.csv \
            --raw results/rigorous-v2_large_n/run-31316561043/analysis/merged_raw.csv \
            --raw results/rigorous-v2_n18/run-31317047080/analysis/merged_raw.csv \
            --output results/exploratory_asymptotic_bridge
          test -s results/exploratory_asymptotic_bridge/per_circuit.csv
          test -s results/exploratory_asymptotic_bridge/summary.csv
          test -s results/exploratory_asymptotic_bridge/manifest.json
      - name: Commit deterministic bridge outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f results/exploratory_asymptotic_bridge
          if git diff --cached --quiet; then
            echo 'Bridge outputs already up to date.'
            exit 0
          fi
          git commit -m 'Add exploratory asymptotic bridge tables'
          git push origin HEAD:${{ github.head_ref }}
