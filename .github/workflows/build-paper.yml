name: Finalize paper layout migration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-paper.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  migrate-references:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Rewrite stale paper paths and filenames
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = (
              ("paper/prx", "paper/manuscript"),
              ("spectral_geometry_prx", "spectral_geometry"),
              ("make_prx_figures.py", "make_paper_figures.py"),
              ("build-prx-combined.yml", "build-paper.yml"),
              ("Build combined PRX manuscript", "Build paper manuscript"),
          )

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          changed = []
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              if not path.exists() or path.is_dir():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))
          print("updated files:")
          print("\n".join(changed))
          PY

          test -f paper/manuscript/spectral_geometry.tex
          test -f paper/manuscript/spectral_geometry_rewrite.tex
          test -f paper/manuscript/make_paper_figures.py
          test ! -e paper/prx
          test ! -e .github/workflows/build-prx-combined.yml

          if git grep -n 'paper/prx'; then
            echo 'Stale paper/prx path remains'
            exit 1
          fi
          if git grep -n 'spectral_geometry_prx'; then
            echo 'Stale spectral_geometry_prx reference remains'
            exit 1
          fi
          if git grep -n 'make_prx_figures.py'; then
            echo 'Stale make_prx_figures.py reference remains'
            exit 1
          fi
          if git grep -n 'build-prx-combined.yml'; then
            echo 'Stale build-prx-combined.yml reference remains'
            exit 1
          fi

          python -m compileall -q paper/manuscript
          git diff --check

      - name: Commit rewritten references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No reference changes needed.'
          else
            git commit -m "Update paper references after layout rename [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
