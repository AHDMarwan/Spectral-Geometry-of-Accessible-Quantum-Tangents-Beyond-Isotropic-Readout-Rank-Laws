name: Build combined PRX manuscript

on:
  pull_request:
    branches: [main]
    paths:
      - 'paper/prx/**'
      - '.github/workflows/build-prx-combined.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip numpy pandas matplotlib

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-publishers zip

      - name: Reconstruct manuscript sources
        run: |
          cd paper/prx
          cat _build_parts/pack_*.part | base64 -d > sources.tar.gz
          tar -xzf sources.tar.gz
          rm sources.tar.gz

      - name: Generate vector figures
        run: |
          cd paper/prx
          python make_prx_figures.py

      - name: Compile manuscript
        run: |
          cd paper/prx
          pdflatex -interaction=nonstopmode -halt-on-error spectral_geometry_prx.tex
          pdflatex -interaction=nonstopmode -halt-on-error spectral_geometry_prx.tex
          pdflatex -interaction=nonstopmode -halt-on-error spectral_geometry_prx.tex
          if grep -q 'Overfull' spectral_geometry_prx.log; then
            echo 'Overfull box detected'
            grep 'Overfull' spectral_geometry_prx.log
            exit 1
          fi

      - name: Build source package
        run: |
          cd paper/prx
          rm -f spectral_geometry_prx_source.zip
          zip -qr spectral_geometry_prx_source.zip spectral_geometry_prx.tex README_BUILD.txt popular_summary.txt make_prx_figures.py figures

      - name: Commit generated manuscript artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/prx/spectral_geometry_prx.tex paper/prx/make_prx_figures.py paper/prx/README_BUILD.txt paper/prx/popular_summary.txt paper/prx/figures paper/prx/spectral_geometry_prx.pdf paper/prx/spectral_geometry_prx_source.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Build combined PRX manuscript [skip ci]'
            git push origin HEAD:${{ github.head_ref }}
          fi
