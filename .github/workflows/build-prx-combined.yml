name: Build combined PRX manuscript

on:
  pull_request:
    branches: [main]
    paths:
      - 'paper/prx/**'
      - '.github/workflows/build-prx-combined.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip numpy pandas matplotlib pennylane

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-publishers texlive-science zip

      - name: Generate legacy vector figures used by the rewrite
        run: |
          cd paper/prx
          python make_prx_figures.py

      - name: Build production rewrite assets
        run: |
          python paper/prx/production_finalize.py
          python paper/prx/figure_scripts/make_publication_figures.py
          python paper/prx/figure_scripts/draw_circuits_pennylane.py
          python paper/prx/insert_circuit_figure.py

      - name: Compile production rewrite
        run: |
          cd paper/prx
          pdflatex -interaction=nonstopmode -halt-on-error spectral_geometry_prx_rewrite.tex
          pdflatex -interaction=nonstopmode -halt-on-error spectral_geometry_prx_rewrite.tex
          pdflatex -interaction=nonstopmode -halt-on-error spectral_geometry_prx_rewrite.tex
          if grep -q 'Overfull' spectral_geometry_prx_rewrite.log; then
            echo 'Overfull box detected'
            grep 'Overfull' spectral_geometry_prx_rewrite.log
            exit 1
          fi
          if grep -q 'undefined citations' spectral_geometry_prx_rewrite.log; then
            echo 'Undefined citation detected'
            exit 1
          fi

      - name: Build review package
        run: |
          cd paper/prx
          rm -f spectral_geometry_prx_rewrite_review.zip
          zip -qr spectral_geometry_prx_rewrite_review.zip \
            spectral_geometry_prx_rewrite.pdf spectral_geometry_prx_rewrite.tex \
            CITATION_EQUATION_AUDIT.md data figure_scripts figures
